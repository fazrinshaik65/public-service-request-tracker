<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Public Service Request Tracker</title>
        <link rel="stylesheet" href="home.css">
        <script src="https://kit.fontawesome.com/859df3b28a.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <header class="header">
            <h1><i class="fa-solid fa-user-gear"></i> Service Partner Dashboard</h1>
            <nav>
                <a href="partner.html">Dashboard</a>
                <a href="partner-history.html">Job History</a>
                <a href="partner-ratings.html">Ratings</a>
                <a href="#" id="logoutPartner">Logout</a>
            </nav>
        </header>
        <div class="hero">
            <h2>Welcome</h2>
            <h3 id="partnerName"></h3>
            <br>
            <h3 id="partnerService"></h3>
            <br><br>
            <div class="container flex">
                <div class="card">
                    <h2 id="totalJobs">0</h2>
                    <p>Total Jobs</p>
                </div>
                <div class="card">
                    <h2 id="pendingJobs">0</h2>
                    <p>Pending</p>
                </div>
                <div class="card">
                    <h2 id="completedJobs">0</h2>
                    <p>Completed</p>
                </div>
            </div>
            <div id="requestContainer" class="container flex"></div>
        </div>
        <!-- Rejection Modal -->
<div id="rejectModal" class="reject-modal">

    <div class="reject-modal-content">

        <div class="reject-modal-header">
            <h2>Reject Service Request</h2>

            <button
                type="button"
                class="close-modal"
                onclick="closeRejectModal()">
                &times;
            </button>
        </div>

        <p class="modal-description">
            Please provide a reason for rejecting this service request.
        </p>

        <label for="rejectionReason">
            Rejection Reason
        </label>

        <textarea
            id="rejectionReason"
            placeholder="Enter reason for rejection..."
            rows="5">
        </textarea>

        <p id="rejectionError" class="rejection-error"></p>

        <div class="modal-buttons">

            <button
                type="button"
                class="cancel-btn"
                onclick="closeRejectModal()">
                Cancel
            </button>

            <button
                type="button"
                class="confirm-reject-btn"
                onclick="submitRejection()">
                Reject Request
            </button>

        </div>

    </div>

</div>
        <script src="partner.js"></script>
    </body>
</html>
