<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Public Service Request Tracker</title>

    </head>
    <body>
        <header class="header">

                        <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                        <option value="4">⭐⭐⭐⭐ (4)</option>
                        <option value="3">⭐⭐⭐ (3)</option>
                        <option value="2">⭐⭐ (2)</option>
                        <option value="1">⭐ (1)</option>
                    </select>
                    <textarea id="feedback" class="input" rows="5" placeholder="Write your feedback" required></textarea>
                    <button class="submit-btn"> Submit Review</button>
                </form>
            </div>
        </div>
        <script src="user.js"></script>
    </body>
</html>
